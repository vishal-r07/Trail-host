<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUANTUM // GHOST V2 (HIL EDITION)</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        /* =========================================
           CORE ARCHITECTURE & ACID-GLASS STYLING
           ========================================= */
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Outfit:wght@400;700;900&display=swap');

        :root {
            --bg-deep: #030305;
            --acid-green: #ccff00;
            --cyber-purple: #b026ff;
            --hacker-cyan: #00f0ff;
            --danger-red: #ff0055;
            --glass-bg: rgba(15, 15, 20, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100vw; height: 100vh;
            background-color: var(--bg-deep); color: #fff;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden; display: flex; justify-content: center; align-items: center;
        }

        /* Canvas Background */
        #node-matrix { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        .vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 20%, var(--bg-deep) 100%); z-index: 1; pointer-events: none; }

        /* Main Application Window */
        #os-window {
            position: relative; z-index: 10;
            width: 98vw; max-width: 1400px; height: 95vh;
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 16px;
            box-shadow: 0 0 60px rgba(0, 240, 255, 0.05);
            display: flex; overflow: hidden;
            animation: bootUp 1s ease-out forwards;
        }

        @keyframes bootUp { from { opacity: 0; transform: scale(0.98) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        /* Sidebar */
        #sidebar {
            width: 300px; border-right: 1px solid var(--glass-border);
            display: flex; flex-direction: column; background: rgba(0, 0, 0, 0.4); padding: 24px;
        }

        .brand {
            font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1.8rem;
            background: linear-gradient(135deg, var(--hacker-cyan), var(--acid-green));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 30px; letter-spacing: -1px; text-transform: uppercase;
        }

        .control-group { margin-bottom: 20px; }
        .control-label { font-size: 0.7rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; }
        
        input[type="text"] {
            width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--glass-border); border-radius: 8px;
            color: var(--hacker-cyan); font-family: 'JetBrains Mono', monospace; outline: none;
        }
        input[type="text"]:focus { border-color: var(--hacker-cyan); }

        button {
            width: 100%; padding: 14px; margin-top: 10px;
            background: transparent; border: 1px solid var(--glass-highlight);
            color: #fff; font-family: 'Outfit', sans-serif; font-weight: 700;
            text-transform: uppercase; border-radius: 8px; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: var(--glass-highlight); }
        button.primary { background: var(--hacker-cyan); color: #000; border: none; }
        button.primary:hover { background: #fff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
        button.action-btn { background: var(--cyber-purple); color: #fff; border: none; }
        button.action-btn:hover { background: #d05cff; box-shadow: 0 0 15px var(--cyber-purple); }

        /* Main Workspace (Split View) */
        #workspace {
            flex-grow: 1; display: flex; flex-direction: column; position: relative;
        }

        #status-bar {
            height: 60px; border-bottom: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
            background: rgba(0,0,0,0.3); font-size: 0.8rem; color: #888;
        }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger-red); display: inline-block; margin-right: 8px; }
        .status-dot.connected { background: var(--acid-green); box-shadow: 0 0 10px var(--acid-green); }

        /* Content Area (Holds Video and Chat) */
        #content-area {
            flex-grow: 1; display: flex; overflow: hidden;
        }

        /* Video Stream Container */
        #video-container {
            flex-grow: 0; width: 0; background: #000; transition: all 0.4s ease;
            display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--glass-border);
            overflow: hidden; position: relative;
        }
        #video-container.active { flex-grow: 2; width: auto; }
        
        video {
            width: 100%; height: 100%; object-fit: contain; background: #000;
        }
        .stream-label {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7);
            padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; color: var(--danger-red);
            border: 1px solid var(--danger-red); animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 0.3; } 100% { opacity: 0.8; } }

        /* Chat Container */
        #chat-section {
            flex-grow: 1; display: flex; flex-direction: column; width: 100%;
        }

        #messages-container {
            flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;
        }
        
        .message-wrapper { max-width: 80%; display: flex; flex-direction: column; animation: slideIn 0.3s forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message-wrapper.self { align-self: flex-end; }
        .message-wrapper.peer { align-self: flex-start; }

        .message-content { padding: 12px 16px; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; word-wrap: break-word; }
        .self .message-content { background: var(--hacker-cyan); color: #000; border-bottom-right-radius: 2px; }
        .peer .message-content { background: rgba(0,0,0,0.6); border: 1px solid var(--glass-border); border-bottom-left-radius: 2px; }
        .msg-image { max-width: 100%; border-radius: 8px; margin-top: 5px; border: 1px solid rgba(255,255,255,0.2); }

        /* Input Area */
        #input-area {
            padding: 20px; border-top: 1px solid var(--glass-border); background: rgba(0,0,0,0.4);
            display: flex; gap: 10px; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        #input-area.active { opacity: 1; pointer-events: auto; }
        #chat-input { flex-grow: 1; padding: 14px; border-radius: 8px; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); color: #fff; }
        .icon-btn { width: 45px; height: 45px; margin: 0; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; border-radius: 8px; }

    </style>
</head>
<body>

    <canvas id="node-matrix"></canvas>
    <div class="vignette"></div>

    <div id="os-window">
        
        <div id="sidebar">
            <div class="brand">GHOST_V2</div>
            
            <div id="setup-panel">
                <div class="control-group">
                    <span class="control-label">Your Desktop ID</span>
                    <input type="text" id="my-id" readonly placeholder="Generating..." onclick="copyToClipboard(this)">
                    <button class="primary" onclick="initPeer()">1. Initialize</button>
                </div>

                <div class="control-group" style="margin-top: 30px;">
                    <span class="control-label">Target Desktop ID</span>
                    <input type="text" id="target-id" placeholder="Paste partner ID">
                    <button onclick="connectToPeer()">2. Connect</button>
                </div>
            </div>

            <div id="active-panel" style="display: none; margin-top: auto;">
                <div class="control-group">
                    <span class="control-label">Media Tools</span>
                    <button class="action-btn" onclick="startScreenShare()" id="share-btn">Cast Screen</button>
                    <button onclick="location.reload()" style="border-color: var(--danger-red); color: var(--danger-red); margin-top: 15px;">Disconnect</button>
                </div>
            </div>
        </div>

        <div id="workspace">
            <div id="status-bar">
                <div><span class="status-dot" id="dot"></span><span id="status-text">OFFLINE</span></div>
                <div>P2P ENCRYPTED // VOLATILE MEMORY // HIL ACTIVE</div>
            </div>

            <div id="content-area">
                <div id="video-container">
                    <div class="stream-label">LIVE FEED</div>
                    <video id="remote-video" autoplay playsinline></video>
                </div>

                <div id="chat-section">
                    <div id="messages-container"></div>

                    <div id="input-area">
                        <input type="file" id="file-input" style="display: none;" accept="image/*">
                        <button class="icon-btn" onclick="document.getElementById('file-input').click()" style="border-color: var(--acid-green); color: var(--acid-green);">📁</button>
                        <input type="text" id="chat-input" placeholder="Type JSON/Message..." autocomplete="off">
                        <button class="icon-btn primary" onclick="sendData()">➤</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === CANVAS BACKGROUND ENGINE ===
        const canvas = document.getElementById('node-matrix');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];
        
        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = Array.from({ length: 80 }, () => ({
                x: Math.random() * width, y: Math.random() * height,
                vx: (Math.random() - 0.5), vy: (Math.random() - 0.5)
            }));
        }
        window.addEventListener('resize', initCanvas);
        
        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(0, 240, 255, 0.4)';
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.1)';
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;
                ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2); ctx.fill();
                
                particles.forEach(p2 => {
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 120) {
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                    }
                });
            });
            requestAnimationFrame(animateCanvas);
        }
        initCanvas(); animateCanvas();

        // === LOCAL PC BRIDGE ENGINE ===
        // This pushes WebRTC data to your local Python/TSMaster script
        const localBridge = new WebSocket('ws://localhost:8080');
        
        localBridge.onopen = () => console.log("Connected to local Python TSMaster Bridge!");
        localBridge.onerror = (err) => console.log("Local Bridge not found. Run Python script.");

        // === WEBRTC CORE (DATA + MEDIA) ===
        let peer = null;
        let dataConnection = null;
        let mediaCall = null;
        let localStream = null;

        const ui = {
            status: document.getElementById('status-text'),
            dot: document.getElementById('dot'),
            inputArea: document.getElementById('input-area'),
            chatInput: document.getElementById('chat-input'),
            msgBox: document.getElementById('messages-container'),
            videoContainer: document.getElementById('video-container'),
            videoEl: document.getElementById('remote-video'),
            shareBtn: document.getElementById('share-btn')
        };

        function updateState(msg, connected = false) {
            ui.status.innerText = msg;
            if (connected) {
                ui.dot.classList.add('connected');
                ui.inputArea.classList.add('active');
                document.getElementById('setup-panel').style.display = 'none';
                document.getElementById('active-panel').style.display = 'block';
            }
        }

        function initPeer() {
            if(peer) return;
            updateState("INITIALIZING NODE...");
            peer = new Peer();
            
            peer.on('open', id => {
                document.getElementById('my-id').value = id;
                updateState("NODE READY. AWAITING UPLINK.");
            });

            // Handle incoming Data Connection
            peer.on('connection', conn => {
                dataConnection = conn;
                setupDataEvents();
            });

            // Handle incoming Media Call (Screen Share)
            peer.on('call', call => {
                call.answer();
                mediaCall = call;
                
                call.on('stream', remoteStream => {
                    ui.videoContainer.classList.add('active');
                    ui.videoEl.srcObject = remoteStream;
                });
                
                call.on('close', () => {
                    ui.videoContainer.classList.remove('active');
                    ui.videoEl.srcObject = null;
                });
            });
        }

        function connectToPeer() {
            const target = document.getElementById('target-id').value.trim();
            if (!target) return alert("Enter ID");
            if (!peer) initPeer();

            updateState("CONNECTING...");
            dataConnection = peer.connect(target);
            setupDataEvents();
        }

        function setupDataEvents() {
            dataConnection.on('open', () => { updateState("UPLINK SECURED", true); });
            dataConnection.on('data', data => {
                
                // ROUTE TO HARDWARE: If local bridge is active, push the data to Python/TSMaster!
                if (localBridge.readyState === WebSocket.OPEN) {
                    localBridge.send(JSON.stringify(data)); 
                }

                // ROUTE TO UI
                if (data.type === 'text') renderMsg(data.payload, 'peer');
                if (data.type === 'image') renderImage(data.payload, 'peer');
            });
            dataConnection.on('close', () => { alert("Disconnected"); location.reload(); });
        }

        // === SCREEN SHARING LOGIC ===
        async function startScreenShare() {
            if (!dataConnection) return alert("Connect to a peer first.");
            
            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: false 
                });

                mediaCall = peer.call(dataConnection.peer, localStream);
                
                ui.shareBtn.innerText = "Sharing Screen...";
                ui.shareBtn.style.background = "var(--danger-red)";

                localStream.getVideoTracks()[0].onended = () => {
                    stopScreenShare();
                };

            } catch (err) {
                console.error("Screen share failed", err);
            }
        }

        function stopScreenShare() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if (mediaCall) {
                mediaCall.close();
            }
            ui.shareBtn.innerText = "Cast Screen";
            ui.shareBtn.style.background = "var(--cyber-purple)";
        }

        // === CHAT & DATA LOGIC ===
        function sendData() {
            const text = ui.chatInput.value.trim();
            if (!text || !dataConnection) return;
            dataConnection.send({ type: 'text', payload: text });
            renderMsg(text, 'self');
            ui.chatInput.value = '';
        }

        ui.chatInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendData(); });

        document.getElementById('file-input').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file || !dataConnection) return;
            const reader = new FileReader();
            reader.onload = ev => {
                const b64 = ev.target.result;
                dataConnection.send({ type: 'image', payload: b64 });
                renderImage(b64, 'self');
            };
            reader.readAsDataURL(file);
        });

        // ==========================================
        //  UI RENDER & 2-MINUTE AUTO-DELETE LOGIC
        // ==========================================
        function renderMsg(text, sender) {
            // Create the element programmatically
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${sender}`;
            wrapper.innerHTML = `<div class="message-content">${escapeHTML(text)}</div>`;
            
            ui.msgBox.appendChild(wrapper);
            ui.msgBox.scrollTop = ui.msgBox.scrollHeight;

            // Trigger self-destruct sequence (120,000 ms = 2 minutes)
            setTimeout(() => {
                wrapper.style.transition = "opacity 0.5s ease, transform 0.5s ease";
                wrapper.style.opacity = "0";
                wrapper.style.transform = "translateY(-10px)";
                // Wait for animation to finish before removing from DOM
                setTimeout(() => wrapper.remove(), 500);
            }, 120000); 
        }

        function renderImage(b64, sender) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${sender}`;
            wrapper.innerHTML = `<div class="message-content" style="padding:4px"><img src="${b64}" class="msg-image" onclick="window.open(this.src)"></div>`;
            
            ui.msgBox.appendChild(wrapper);
            ui.msgBox.scrollTop = ui.msgBox.scrollHeight;

            // Trigger self-destruct sequence (120,000 ms = 2 minutes)
            setTimeout(() => {
                wrapper.style.transition = "opacity 0.5s ease, transform 0.5s ease";
                wrapper.style.opacity = "0";
                wrapper.style.transform = "translateY(-10px)";
                setTimeout(() => wrapper.remove(), 500);
            }, 120000);
        }

        function copyToClipboard(el) {
            if(!el.value) return;
            el.select(); document.execCommand('copy');
            alert("ID Copied!");
        }

        function escapeHTML(str) { return str.replace(/[&<>'"]/g, t => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[t])); }
    </script>
</body>
</html>

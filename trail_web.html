<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST // SYNC</title>
    <!-- PeerJS for WebRTC (Peer-to-Peer) -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        /* === BASE SETTINGS & GEN Z VIBE === */
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Syne:wght@700;800&display=swap');

        :root {
            --bg-color: #050505;
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --acid-green: #baff29;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
        }

        body, html {
            height: 100%;
            background-color: var(--bg-color);
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* === ANIMATED BACKGROUND === */
        .grid-bg {
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: 
                linear-gradient(var(--glass-border) 1px, transparent 1px),
                linear-gradient(90deg, var(--glass-border) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 10s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(40px) translateZ(-200px); }
        }

        .blob {
            position: absolute;
            width: 400px; height: 400px;
            background: radial-gradient(circle, var(--neon-pink) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 8s infinite alternate ease-in-out;
            z-index: 0;
        }
        .blob.cyan { background: radial-gradient(circle, var(--neon-cyan) 0%, transparent 70%); top: 10%; right: 10%; animation-delay: -4s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }

        /* === APP CONTAINER (GLASSMORPHISM) === */
        #app {
            position: relative;
            z-index: 10;
            width: 95%; max-width: 500px; height: 90vh;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* === SETUP SCREEN === */
        #setup-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 2rem;
            text-align: center;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: -2px;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0%, 100% { text-shadow: none; }
            92% { text-shadow: 2px 0 var(--neon-cyan), -2px 0 var(--neon-pink); }
            94% { text-shadow: -2px 0 var(--neon-cyan), 2px 0 var(--neon-pink); }
            96% { text-shadow: 0 0 none; }
        }

        .subtitle { color: #888; margin-bottom: 2rem; font-size: 0.9rem; }

        input {
            width: 100%; padding: 16px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #fff; font-size: 1.1rem;
            outline: none; text-align: center;
            transition: all 0.3s;
            margin-bottom: 1rem;
        }

        input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 255, 255, 0.2); }

        button {
            width: 100%; padding: 16px;
            background: var(--acid-green);
            color: #000; border: none;
            border-radius: 12px;
            font-size: 1.1rem; font-weight: 700;
            cursor: pointer; text-transform: uppercase;
            transition: all 0.2s;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(186, 255, 41, 0.4); }
        button:active { transform: translateY(0); }

        /* === CHAT SCREEN === */
        #chat-screen {
            display: none; flex-direction: column; height: 100%;
        }

        header {
            padding: 20px;
            border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.3);
        }

        .status {
            font-size: 0.8rem; display: flex; align-items: center; gap: 8px;
        }

        .dot {
            width: 8px; height: 8px; background: var(--acid-green);
            border-radius: 50%; box-shadow: 0 0 10px var(--acid-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        #messages {
            flex-grow: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 15px;
        }

        /* Scrollbar hide */
        #messages::-webkit-scrollbar { width: 0; }

        .msg-wrap {
            max-width: 85%; position: relative;
            animation: slideIn 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .msg-wrap.self { align-self: flex-end; }
        .msg-wrap.peer { align-self: flex-start; }

        .msg {
            padding: 12px 18px; border-radius: 16px;
            font-size: 1rem; line-height: 1.4; word-wrap: break-word;
        }

        .self .msg { background: var(--neon-cyan); color: #000; border-bottom-right-radius: 4px; }
        .peer .msg { background: #222; border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; }

        /* 2 Minute Auto-Destruct Timer Bar */
        .timer-bar {
            height: 2px; background: rgba(255,255,255,0.3);
            margin-top: 4px; border-radius: 2px;
            width: 100%; transform-origin: left;
            animation: shrink 120s linear forwards; /* 120 seconds exact */
        }
        .self .timer-bar { background: rgba(0,0,0,0.3); }

        @keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { to { opacity: 0; transform: scale(0.9); } }

        .input-area {
            padding: 20px; border-top: 1px solid var(--glass-border);
            display: flex; gap: 10px; background: rgba(0,0,0,0.3);
        }

        .input-area input { margin-bottom: 0; border-radius: 24px; padding: 12px 20px; text-align: left; }
        .input-area button { width: auto; padding: 0 24px; border-radius: 24px; background: var(--neon-pink); color: white; }
        .input-area button:hover { box-shadow: 0 5px 15px rgba(255, 0, 255, 0.4); }

        .sys-msg {
            text-align: center; color: #888; font-size: 0.8rem;
            align-self: center; margin: 10px 0; text-transform: uppercase; letter-spacing: 1px;
        }

    </style>
</head>
<body>

    <div class="blob"></div>
    <div class="blob cyan"></div>
    <div class="grid-bg"></div>

    <div id="app">
        <!-- SCREEN 1: SETUP -->
        <div id="setup-screen">
            <h1>Ghost Sync</h1>
            <p class="subtitle">Zero DB. Zero Trace. 120s Auto-Destruct.</p>
            
            <div id="init-box">
                <button onclick="createRoom()">Create New Sync</button>
                <div style="margin: 20px 0; color: #555;">— OR —</div>
                <input type="text" id="join-id" placeholder="Paste Sync Key here" autocomplete="off">
                <button onclick="joinRoom()" style="background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan);">Join Sync</button>
            </div>

            <div id="loading-box" style="display:none; margin-top: 20px;">
                <p style="color: var(--neon-pink);">Waiting for connection...</p>
                <p style="font-size: 0.8rem; color: #888; margin-top: 10px;">Your Sync Key (Copy & open on mobile):</p>
                <input type="text" id="my-peer-id" readonly onclick="this.select(); document.execCommand('copy'); alert('Copied!')" style="cursor: pointer; margin-top: 5px;">
            </div>
        </div>

        <!-- SCREEN 2: CHAT -->
        <div id="chat-screen">
            <header>
                <div style="font-weight: 700; letter-spacing: 1px;">GHOST_CHANNEL</div>
                <div class="status"><div class="dot"></div> LINKED</div>
            </header>
            
            <div id="messages">
                <div class="sys-msg">P2P Encrypted. Messages vanish in 2 mins.</div>
            </div>
            
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Type message..." autocomplete="off">
                <button onclick="sendMsg()">SEND</button>
            </div>
        </div>
    </div>

    <script>
        // === CORE P2P LOGIC ===
        let peer = null;
        let conn = null;
        const msgLifetime = 120000; // 120 seconds in milliseconds

        const setupScreen = document.getElementById('setup-screen');
        const chatScreen = document.getElementById('chat-screen');
        const initBox = document.getElementById('init-box');
        const loadingBox = document.getElementById('loading-box');
        const myPeerIdInput = document.getElementById('my-peer-id');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msg-input');

        // 1. Create a Room (Device A - Laptop)
        function createRoom() {
            initBox.style.display = 'none';
            loadingBox.style.display = 'block';
            
            // Initialize PeerJS
            peer = new Peer(); 
            
            peer.on('open', (id) => {
                myPeerIdInput.value = id; // Show the generated Sync Key
            });

            // Listen for Device B connecting
            peer.on('connection', (connection) => {
                conn = connection;
                setupChat();
            });
        }

        // 2. Join a Room (Device B - Mobile)
        function joinRoom() {
            const targetId = document.getElementById('join-id').value.trim();
            if (!targetId) return alert("Enter a valid Sync Key!");

            peer = new Peer();
            
            peer.on('open', () => {
                // Connect to Device A
                conn = peer.connect(targetId);
                setupChat();
            });
        }

        // 3. Setup the Chat interface once connected
        function setupChat() {
            conn.on('open', () => {
                setupScreen.style.display = 'none';
                chatScreen.style.display = 'flex';
                
                // Listen for incoming messages
                conn.on('data', (data) => {
                    renderMessage(data, 'peer');
                });
            });

            conn.on('close', () => {
                alert("Connection lost. Refresh to restart.");
                location.reload();
            });
        }

        // 4. Send a Message
        function sendMsg() {
            const text = msgInput.value.trim();
            if (!text || !conn) return;

            // Send via WebRTC Data Channel (No API, No Database)
            conn.send(text);
            
            // Render on our own screen
            renderMessage(text, 'self');
            msgInput.value = '';
        }

        // Handle Enter key
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMsg();
        });

        // 5. Render Message & Handle Auto-Destruction
        function renderMessage(text, sender) {
            const wrap = document.createElement('div');
            wrap.className = `msg-wrap ${sender}`;
            
            const msgObj = document.createElement('div');
            msgObj.className = 'msg';
            msgObj.innerText = text;

            const timerBar = document.createElement('div');
            timerBar.className = 'timer-bar';

            wrap.appendChild(msgObj);
            wrap.appendChild(timerBar);
            messagesDiv.appendChild(wrap);

            // Auto scroll
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            // The extraordinary part: Absolute auto-destruct
            setTimeout(() => {
                wrap.style.animation = 'fadeOut 0.5s ease forwards';
                setTimeout(() => {
                    if(wrap.parentNode) wrap.parentNode.removeChild(wrap);
                }, 500);
            }, msgLifetime);
        }
    </script>
</body>
</html>
